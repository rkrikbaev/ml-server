services:
  ml_model:
    image: fpcloud/ml:1.0.0
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: models_${MODEL:-models}
    restart: unless-stopped
    command: >
      bash -c "
        taskiq worker api.broker:broker --workers 8 &
        python3.13 -u -m uvicorn api.server:app --host 0.0.0.0 --port 8000 &
        wait -n
      "
    ports:
      - "${PORT:-8030}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace/server:/workspace/lib
      - TEST_MODE=true
      - SCADA_STUB_ENABLED=${SCADA_STUB_ENABLED:-true}
    volumes:
      - "../local/${MODEL:-models}:/workspace/models"
      - "./src:/workspace/server"
      - "../models:/workspace/lib"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 1024M
    tty: true
    stdin_open: true
    networks:
      - ml

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ml

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    restart: unless-stopped
    # Run the MLflow tracking server explicitly. The upstream image's default
    # CMD may not start the server (it can default to `python3`), causing the
    # container to exit with code 0. Provide an explicit command so the
    # container stays running and serves the UI on the mapped port.
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/mlruns
    ports:
      - "${MLFLOW_PORT:-5050}:5000"
    volumes:
      - "../mlruns:/mlflow/mlruns"
    networks:
      - ml

networks:
  ml:
    driver: bridge

volumes:
  redis_data:
