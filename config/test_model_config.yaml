# ============================================================================
# Test Model Configuration
# ============================================================================
# Generated: 20.04.2026
# Purpose: Configuration for test Prophet forecasting model

name: prophet_watt_h_AKMOLA_test
version: 1.0.0
type: prophet
status: active

# ============================================================================
# MODEL PARAMETERS
# ============================================================================
model:
  type: prophet
  horizon: 24
  freq: h
  interval_width: 0.95
  seasonality_mode: additive
  seasonality_prior_scale: 10.0
  seasonality_reg_coef: 0.0
  changepoint_prior_scale: 0.05
  yearly_seasonality: true
  weekly_seasonality: true
  daily_seasonality: false

# ============================================================================
# DATA SOURCE CONFIGURATION
# ============================================================================
data_source:
  object_reference: /KAZ/AKMOLA/@models/P_WATT
  region: AKMOLA
  entity_type: load
  entity_name: P_WATT
  
  # Data collection period
  lookback_period: 168  # hours (7 days)
  
  # APIs to collect data from
  apis:
    - name: load
      endpoint: /api/load
      params:
        object_reference: /KAZ/AKMOLA/@models/P_WATT
      timeout: 30
      retry_count: 3
      required: true
      
    - name: weather
      endpoint: /api/weather
      params:
        region: AKMOLA
      timeout: 30
      retry_count: 3
      required: false

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Training data characteristics
  train_size: 0.8
  test_size: 0.2
  validation_size: 0.1
  
  # Training parameters
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  
  # Optimization
  optimizer: adam
  loss_function: mse
  
  # Early stopping
  early_stopping_enabled: true
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001

# ============================================================================
# INFERENCE CONFIGURATION
# ============================================================================
inference:
  # Request validation
  validate_input: true
  max_input_size: 10000
  
  # Response formatting
  include_confidence_intervals: true
  confidence_level: 0.95
  
  # Performance
  max_workers: 4
  timeout: 60
  batch_size: 1
  
  # Caching
  enable_cache: false
  cache_ttl: 3600

# ============================================================================
# METRICS & MONITORING
# ============================================================================
metrics:
  # Training metrics
  mae_threshold: 50.0
  mape_threshold: 0.1
  rmse_threshold: 75.0
  
  # Monitoring thresholds
  prediction_anomaly_threshold: 3.0  # std deviations
  data_freshness_threshold: 3600     # seconds

# ============================================================================
# FEATURES
# ============================================================================
features:
  # Input features
  inputs:
    - name: timestamp
      type: datetime
      required: true
      
    - name: load
      type: float
      required: true
      description: Current load in MW
      
    - name: temperature
      type: float
      required: false
      description: Temperature in Celsius
      
    - name: wind_speed
      type: float
      required: false
      description: Wind speed in m/s

  # Target feature
  target:
    name: load
    type: float
    unit: MW

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================
performance:
  inference_time_target: 2.0  # seconds
  data_collection_time_target: 1.0  # seconds
  model_loading_time_target: 0.2  # seconds
  
  # SLA
  availability_target: 0.99
  accuracy_target: 0.9

# ============================================================================
# DEPLOYMENT
# ============================================================================
deployment:
  environment: test
  replicas: 1
  resource_limits:
    cpu: "1000m"
    memory: "512Mi"
  
  # Update strategy
  update_strategy: rolling
  max_surge: 1
  max_unavailable: 0

# ============================================================================
# TAGS & METADATA
# ============================================================================
tags:
  horizon: "24"
  model_type: "prophet"
  data_source_config: '{"apis": [{"name": "load", "endpoint": "/api/load"}]}'
  created_date: "2026-04-20"
  creator: "test_system"
  environment: "test"
  region: "AKMOLA"
  
metadata:
  description: "Test Prophet model for AKMOLA region load forecasting"
  author: "ML Infrastructure Team"
  maintainer: "ml-infra@company.com"
  documentation: "https://docs.internal/models/prophet_watt_h_AKMOLA"
  last_updated: "2026-04-20T00:00:00Z"
